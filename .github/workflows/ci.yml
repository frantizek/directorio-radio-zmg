name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Instalar dependencias
        run: uv sync

      - name: Tests
        run: uv run pytest

      - name: Linter
        run: uv run ruff check .

      - name: Sintaxis del frontend
        run: node --check js/config.js && node --check js/i18n.js && node --check js/github.js && node --check js/app.js

      - name: README sincronizado con el JSON
        run: |
          uv run python scripts/generate_readme.py
          git diff --exit-code README.md